  <script>
    (async function clearLegacyOfflineCache() {
      if (!('serviceWorker' in navigator)) return;
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
      if (navigator.serviceWorker.controller && sessionStorage.getItem('ccems-sw-cleaned') !== '108') {
        sessionStorage.setItem('ccems-sw-cleaned', '108');
        location.replace('field-journal-live.html?fresh=108&cache-cleared=1');
      }
    })();
  </script>
